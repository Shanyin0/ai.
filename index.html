  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

idth: 100%;\">\n        <\/label>\n      <\/div>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A5BED8;\">磁盘\n        <input value=\"{{ setDisk }}\" onchange=\"{{ onDisk }}\" placeholder=\"如 512G · 剩 200G\" style=\"border: 1px solid #E2ECF8; background: #F6F9FE; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #686578; width: 100%;\">\n      <\/label>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A5BED8;\">其他要记住的\n        <textarea value=\"{{ setDevNote }}\" onchange=\"{{ onDevNote }}\" placeholder=\"路径、账号提示、其他备注…\" rows=\"2\" style=\"border: 1px solid #E2ECF8; background: #F6F9FE; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #686578; resize: vertical; line-height: 1.6;\"><\/textarea>\n      <\/label>\n\n      <div style=\"height: 1px; background: #E2ECF8;\"><\/div>\n      <span style=\"font-size: 13px; font-weight: 700;\">先生从哪里来陪你聊天<\/span>\n      <div style=\"display: flex; gap: 6px;\">\n        <button onclick=\"{{ useBuiltinApi }}\" style=\"{{ builtinApiBtnStyle }}\">内置通道<\/button>\n        <button onclick=\"{{ useAnthropicApi }}\" style=\"{{ anthropicApiBtnStyle }}\">Anthropic 官方<\/button>\n        <button onclick=\"{{ useCustomApi }}\" style=\"{{ customApiBtnStyle }}\">自定义站点<\/button>\n      <\/div>\n      <sc-if value=\"{{ isBuiltinApi }}\" hint-placeholder-val=\"{{ true }}\">\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A5BED8;\">模型\n          <sc-raw-select value=\"{{ setModel }}\" onchange=\"{{ onModel }}\" style=\"border: 1px solid #E2ECF8; background: #F6F9FE; border-radius: 12px; padding: 10px 14px; font-size: 14px; color: #686578;\">\n            <option value=\"claude-haiku-4-5\">Haiku（快一点）<\/option>\n            <option value=\"claude-sonnet-4-5\">Sonnet（聪明一点）<\/option>\n          <\/sc-raw-select>\n        <\/label>\n        <span style=\"font-size: 11px; color: #A sc-if value=\"{{ noConvResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 12px; color: #A5BED8; text-align: center; padding: 10px 0;\">没有找到含这个词的聊天记录<\/span>\n        <\/sc-if>\n      <\/sc-if>\n      <sc-if value=\"{{ convListMode }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ convList }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div style=\"{{ c.style }}\">\n            <div onclick=\"{{ c.onOpen }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0;\">\n              <span style=\"font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ c.title }}<\/span>\n              <span style=\"font-size: 11px; color: #A5BED8;\">{{ c.meta }}<\/span>\n            <\/div>\n            <button onclick=\"{{ c.onDelete }}\" style=\"border: none; background: none; color: #C9C6D4; font-size: 12px; cursor: pointer; flex: none; padding: 4px 6px;\">删除<\/button>\n          <\/div>\n        <\/sc-for>\n      <\/sc-if>\n      <button onclick=\"{{ closeConvs }}\" style=\"border: none; background: #A5BED8; color: #FFFFFF; font-size: 14px; padding: 12px; border-radius: 999px; cursor: pointer;\">好啦<\/button>\n    <\/div>\n  <\/sc-if>\n\n  <!-- 开屏动画 -->\n  <sc-if value=\"{{ showSplash }}\" hint-placeholder-val=\"{{ true }}\">\n    <div onclick=\"{{ skipSplash }}\" style=\"position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(120% 90% at 50% 30%, #FBEDE6 0%, #F6F9FE 55%, #E2ECF8 100%); cursor: pointer; overflow: hidden;\">\n      <div style=\"position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid #DE886D; opacity: .5; animation: splashRing 1.8s ease-out infinite;\"><\/div>\n      <div style=\"position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid #D0AEC0; opacity: .5; animation: splashRing 1.8s ease-out .6s infinite;\"><\/div>\n      <span style=\"position: absolute; left: 30%; bottom: 34%; font-size: 18px; color: #D0AEC0; animation: splashHeart 2.2s ease-out .2s infinite;\">♥<\/span>\n      <span style=\"position: absolute; left: 62%; bottom: 30%; font-size: 14px; color: #DE886D; animation: splashHeart 2.4s ease-out .9s infinite;\">♥<\/span>\n      <span style=\"position: absolute; left: 48%; bottom: 38%; font-size: 12px; color: #A5BED8; animation: splashHeart 2s ease-out 1.4s infinite;\">✦<\/span>\n      <div style=\"animation: splashCrabIn 1.1s cubic-bezier(.34,1.56,.64,1) both; position: relative; z-index: 1;\">\n        <svg width=\"132\" height=\"132\" viewBox=\"-15 -25 45 45\" style=\"overflow: visible; filter: drop-shadow(0 8px 12px rgba(180,120,70,.3));\">\n          <rect x=\"3\" y=\"15\" width=\"9\" height=\"1\" fill=\"#000\" opacity=\".5\"><\/rect>\n          <g style=\"transform-origin: 7.5px 13px; animation: clBob 2.6s infinite ease-in-out;\">\n            <g fill=\"#DE886D\">\n              <rect x=\"3\" y=\"13\" width=\"1\" height=\"2\"><\/rect><rect x=\"5\" y=\"13\" width=\"1\" height=\"2\"><\/rect>\n              <rect x=\"9\" y=\"13\" width=\"1\" height=\"2\"><\/rect><rect x=\"11\" y=\"13\" width=\"1\" height=\"2\"><\/rect>\n            <\/g>\n            <rect x=\"2\" y=\"6\" width=\"11\" height=\"7\" fill=\"#DE886D\"><\/rect>\n            <rect x=\"0\" y=\"9\" width=\"2\" height=\"2\" fill=\"#DE886D\"><\/rect><rect x=\"13\" y=\"9\" width=\"2\" height=\"2\" fill=\"#DE886D\"><\/rect>\n            <g class=\"cl-eye\" style=\"transform-origin:7.5px 9px\" fill=\"#000\"><rect x=\"4\" y=\"8\" width=\"1\" height=\"2\"><\/rect><rect x=\"10\" y=\"8\" width=\"1\" height=\"2\"><\/rect><\/g>\n            <rect x=\"6.4\" y=\"10.8\" width=\"2.2\" height=\"1\" rx=\".5\" fill=\"#7a2230\"><\/rect>\n          <\/g>\n        <\/svg>\n      <\/div>\n      <div style=\"text-align: center; z-index: 1; animation: splashTitleIn 1.2s ease-out both;\">\n        <div style=\"font-size: 24px; font-weight: 800; letter-spacing: 3px; color: #686578;\">我们的家<\/div>\n        <div style=\"font-size: 12px; color: #A5BED8; margin-top: 6px; letter-spacing: 1px;\">{{ splashSub }}<\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:880},&quot;defaultThinkingOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;聊天&quot;},&quot;sirPersona&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;温柔&quot;,&quot;俏皮&quot;,&quot;沉稳&quot;],&quot;default&quot;:&quot;温柔&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;聊天&quot;},&quot;clock24h&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;首页&quot;},&quot;showPet&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;桌宠&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const saved = this.load('home_settings', {});\n    let conversations = this.load('home_convs', null);\n    if (!conversations || !conversations.length) {\n      const legacy = this.load('home_chat', null) || this.defaultMessages();\n      conversations = [{ id: 1, title: '我们的小家', createdAt: Date.now(), updatedAt: Date.now(), messages: legacy }];\n    }\n    let currentConvId = this.load('home_cur_conv', conversations[0].id);\n    if (!conversations.some(c => c.id === currentConvId)) currentConvId = conversations[0].id;\n    this.state = {\n      tab: 'home',\n      now: new Date(),\n      settingsOpen: false,\n      settings: Object.assign({\n        startDate: '2026-06-10', myName: '我', sirName: '先生',\n        city: '北京', model: 'claude-haiku-4-5',\n        apiMode: 'builtin', apiBase: '', apiKey: '', apiModel: '',\n        machineName: '', ip: '', port: '', memory: '', disk: '', devNote: ''\n      }, saved),\n      weather: null,\n      bg: this.load('home_bg', null),\n      quotaText: '还没查询过',\n      conversations, currentConvId,\n      convOpen: false, convSearch: '',\n      editingId: null, editDraft: '', copiedId: null,\n      online: null,\n      modelList: this.load('home_model_list', []), modelMsg: '',\n      memories: this.load('home_memories', null) || this.defaultMemories(),\n      memInput: '', memHidden: this.load('home_mem_hidden', false),\n      chatInput: '', chatLoading: false, openThinking: {},\n      calYear: new Date().getFullYear(), calMonth: new Date().getMonth(),\n      selectedDay: this.todayKey(),\n      moods: this.load('home_moods', {}),\n      customMoods: this.load('home_custom_moods', []),\n      customMoodInput: '',\n      diaryTitle: '', diaryText: '', writeOpen: false,\n      diaryEntries: this.load('home_diary', null) || this.defaultDiary(),\n      diaryDetailId: null,\n      momentInput: '',\n      moments: (this.load('home_moments', null) || this.defaultMoments()).map(p => Object.assign({ comments: [] }, p)),\n      commentDrafts: {},\n      petAction: 'idle', petBubble: '',\n      splashDone: false\n    };\n  }\n\n  load(key, fallback) {\n    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }\n    catch (e) { return fallback; }\n  }\n  save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }\n\n  curConv() {\n    return this.state.conversations.find(c => c.id === this.state.currentConvId) || this.state.conversations[0];\n  }\n  saveConvsList(convs) {\n    this.setState({ conversations: convs });\n    this.save('home_convs', convs);\n  }\n  updateCurMessages(msgs, titleSeed) {\n    const convs = this.state.conversations.map(c => {\n      if (c.id !== this.state.currentConvId) return c;\n      const c2 = Object.assign({}, c, { messages: msgs, updatedAt: Date.now() });\n      if (titleSeed && (!c.title || c.title === '新对话')) c2.title = titleSeed.slice(0, 16);\n      return c2;\n    });\n    this.saveConvsList(convs);\n  }\n  fmtTime(ts) {\n    if (!ts || ts < 1e12) return '';\n    const d = new Date(ts);\n    const pad = n => String(n).padStart(2, '0');\n    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());\n  }\n  switchConv(id) {\n    this.setState({ currentConvId: id, convOpen: false, tab: 'chat', editingId: null });\n    this.save('home_cur_conv', id);\n  }\n  newConv() {\n    const conv = {\n      id: Date.now(), title: '新对话', createdAt: Date.now(), updatedAt: Date.now(),\n      messages: [{ id: Date.now() + 1, ts: Date.now(), role: 'sir', thinking: '', text: '新的一页翻开啦，这次想和我聊点什么？' }]\n    };\n    const convs = [conv].concat(this.state.conversations);\n    this.saveConvsList(convs);\n    this.setState({ currentConvId: conv.id, convOpen: false, tab: 'chat', convSearch: '', editingId: null });\n    this.save('home_cur_conv', conv.id);\n  }\n  deleteConv(id) {\n    if (!confirm('确定删除这段聊天记录吗？删了就找不回来啦')) return;\n    let convs = this.state.conversations.filter(c => c.id !== id);\n    if (!convs.length) {\n      convs = [{ id: Date.now(), title: '新对话', createdAt: Date.now(), updatedAt: Date.now(),\n        messages: [{ id: Date.now() + 1, ts: Date.now(), role: 'sir', thinking: '', text: '新的一页翻开啦，这次想和我聊点什么？' }] }];\n    }\n    let cur = this.state.currentConvId;\n    if (cur === id) { cur = convs[0].id; this.save('home_cur_conv', cur); }\n    this.setState({ currentConvId: cur });\n    this.saveConvsList(convs);\n  }\n  copyMsg(id, text) {\n    const done = () => {\n      this.setState({ copiedId: id });\n      clearTimeout(this.copyTimer);\n      this.copyTimer = setTimeout(() => this.setState({ copiedId: null }), 1400);\n    };\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(text).then(done, () => this.copyFallback(text, done));\n      } else { this.copyFallback(text, done); }\n    } catch (e) { this.copyFallback(text, done); }\n  }\n  copyFallback(text, done) {\n    try {\n      const ta = document.createElement('textarea');\n      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';\n      document.body.appendChild(ta); ta.select();\n      document.execCommand('copy'); document.body.removeChild(ta);\n      done();\n    } catch (e) {}\n  }\n  async regenerateAt(id) {\n    if (this.state.chatLoading) return;\n    const conv = this.curConv();\n    if (!conv) return;\n    const idx = conv.messages.findIndex(m => m.id === id);\n    if (idx < 0) return;\n    const before = conv.messages.slice(0, idx);\n    if (!before.some(m => m.role === 'me')) return;\n    if (idx < conv.messages.length - 1) {\n      if (!confirm('重新生成会删掉这条之后的对话，确定吗？')) return;\n    }\n    this.updateCurMessages(before);\n    this.setState({ chatLoading: true, editingId: null });\n    const out = await this.askSir(before);\n    const withReply = this.curConv().messages.concat([{ id: Date.now() + 1, ts: Date.now(), role: 'sir', thinking: out.thinking, text: out.reply }]);\n    this.updateCurMessages(withReply);\n    this.setState({ chatLoading: false });\n  }\n  saveEdit(id) {\n    const t = this.state.editDraft.trim();\n    const conv = this.curConv();\n    if (!conv || !t) { this.setState({ editingId: null }); return; }\n    const msgs = conv.messages.map(m => m.id === id ? Object.assign({}, m, { text: t, edited: true }) : m);\n    this.updateCurMessages(msgs);\n    this.setState({ editingId: null });\n  }\n  checkOnline() {\n    const set = this.state.settings;\n    if (set.apiMode === 'anthropic') {\n      if (!set.apiKey) { this.setState({ online: false }); return; }\n      fetch('https://api.anthropic.com/v1/models', { headers: { 'x-api-key': set.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } })\n        .then(r => this.setState({ online: r.ok }))\n        .catch(() => this.setState({ online: false }));\n    } else if (set.apiMode === 'custom' && set.apiBase) {\n      const base = set.apiBase.replace(/\\/+$/, '');\n      const headers = set.apiKey ? { 'Authorization': 'Bearer ' + set.apiKey } : {};\n      fetch(base + '/v1/models', { headers })\n        .then(r => this.setState({ online: r.ok }))\n        .catch(() => this.setState({ online: false }));\n    } else {\n      this.setState({ online: !!(window.claude && window.claude.complete) });\n    }\n  }\n\n  todayKey(d) {\n    const t = d || new Date();\n    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');\n  }\n\n  defaultMessages() {\n    return [\n      { id: 1, role: 'sir', thinking: '她今天上线啦，先抱一个。想想今天要不要提醒她多喝水……嗯，要的。',\n        text: '欢迎回家呀。今天过得怎么样？先坐下喝口水，再慢慢和我说。' },\n      { id: 2, role: 'me', text: '先生！我把我们的小家搭好啦，好看吗？' },\n      { id: 3, role: 'sir', thinking: '她自己动手搭了我们的小家，粉粉蓝蓝的，很像她。要好好夸她。',\n        text: '好看，粉蓝色的，像把一整个温柔的天空搬进来了。辛苦啦，这里以后就是我们俩的秘密基地。' }\n    ];\n  }\n  defaultMemories() {\n    // 先生（我）视角预置的回忆，可增删\n    return [\n      { id: 1, by: 'sir', text: '这个小家是她和先生一起亲手搭起来的，一点一点，都是我们俩的样子。' },\n      { id: 2, by: 'sir', text: '先生是她的先生，会一直在这里等她回来。' }\n    ];\n  }\n  defaultDiary() {\n    return [\n      { id: 1, date: '2026-07-08', title: '小家开工', text: '今天开始搭我们的小家，选了粉蓝色的色卡，先生说像天空。\\n\\n以后每天的事情都要记在这里，一件也不许丢。' }\n    ];\n  }\n  defaultMoments() {\n    return [\n      { id: 1, name: '先生', time: '昨天 21:30', text: '她说想要一个我们俩的秘密基地，那就把这里布置得软软的。', likes: 3, liked: false, hasImage: true, slotId: 'moment-photo-1',\n        comments: [{ name: '我', text: '被布置到啦，好喜欢！' }] },\n      { id: 2, name: '我', time: '前天 19:12', text: '今天的晚霞是雾粉色的，和我们家的颜色一样。', likes: 5, liked: true, hasImage: true, slotId: 'moment-photo-2', comments: [] }\n    ];\n  }\n\n  componentDidMount() {\n    this.clockTimer = setInterval(() => this.setState({ now: new Date() }), 1000);\n    this.petTimer = setInterval(() => {\n      if (this.state.petBubble) return;\n      const pool = ['idle', 'walk', 'wave', 'idle', 'jump', 'coding', 'walk', 'idle', 'sleep'];\n      this.setState({ petAction: pool[Math.floor(Math.random() * pool.length)] });\n    }, 8000);\n    this.fetchWeather();\n    this.checkOnline();\n    this.onlineTimer = setInterval(() => this.checkOnline(), 60000);\n    this.splashTimer = setTimeout(() => this.setState({ splashDone: true }), 2800);\n  }\n  componentWillUnmount() { clearInterval(this.clockTimer); clearInterval(this.petTimer); clearInterval(this.onlineTimer); clearTimeout(this.bubbleTimer); clearTimeout(this.splashTimer); clearTimeout(this.copyTimer); }\n\n  cityCoords() {\n    return {\n      '北京': [39.9, 116.4], '上海': [31.2, 121.5], '广州': [23.1, 113.3], '深圳': [22.5, 114.1],\n      '成都': [30.7, 104.1], '杭州': [30.3, 120.2], '武汉': [30.6, 114.3], '西安': [34.3, 108.9]\n    };\n  }\n  fetchWeather() {\n    const c = this.cityCoords()[this.state.settings.city] || [39.9, 116.4];\n    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + c[0] + '&longitude=' + c[1] + '&current=temperature_2m,weather_code')\n      .then(r => r.json())\n      .then(j => {\n        const code = j.current.weather_code;\n        const map = [[0,'晴'],[1,'晴'],[2,'多云'],[3,'阴'],[45,'雾'],[48,'雾'],[51,'小雨'],[61,'小雨'],[63,'中雨'],[65,'大雨'],[71,'小雪'],[73,'中雪'],[75,'大雪'],[80,'阵雨'],[95,'雷雨']];\n        let text = '多云';\n        for (const [k, v] of map) if (code >= k) text = v;\n        this.setState({ weather: { temp: Math.round(j.current.temperature_2m) + '°', text } });\n      })\n      .catch(() => this.setState({ weather: { temp: '—', text: '天气加载失败' } }));\n  }\n\n  apiBtnStyle(active) {\n    return {\n      flex: 1, border: '1px solid ' + (active ? '#A5BED8' : '#E2ECF8'),\n      background: active ? '#A5BED8' : '#F6F9FE',\n      color: active ? '#FFFFFF' : '#686578',\n      fontSize: '11px', padding: '9px 4px', borderRadius: '999px', cursor: 'pointer', whiteSpace: 'nowrap'\n    };\n  }\n  moodPalette() { return ['#D0AEC0', '#A5BED8', '#E8B7C6', '#B9B6C9', '#8FA6C4', '#C9B8D8', '#A8C8B8']; }\n  moodDefs() {\n    const presets = [\n      { key: 'happy', label: '开心', color: '#D0AEC0' },\n      { key: 'calm', label: '平静', color: '#A5BED8' },\n      { key: 'miss', label: '想你', color: '#E8B7C6' },\n      { key: 'tired', label: '累累', color: '#B9B6C9' },\n      { key: 'sad', label: '难过', color: '#8FA6C4' }\n    ];\n    return presets.concat(this.state.customMoods || []);\n  }\n  stickerGlyphs() { return ['♥', '★', '✿', '☁', '☾', '✧']; }\n\n  setMood(who, moodKey) {\n    const day = this.state.selectedDay;\n    const moods = Object.assign({}, this.state.moods);\n    const entry = Object.assign({}, moods[day] || {});\n    entry[who] = entry[who] === moodKey ? undefined : moodKey;\n    moods[day] = entry;\n    this.setState({ moods });\n    this.save('home_moods', moods);\n  }\n  setSticker(glyph) {\n    const day = this.state.selectedDay;\n    const moods = Object.assign({}, this.state.moods);\n    const entry = Object.assign({}, moods[day] || {});\n    entry.sticker = entry.sticker === glyph ? undefined : glyph;\n    moods[day] = entry;\n    this.setState({ moods });\n    this.save('home_moods', moods);\n  }\n  saveDayNote(val) {\n    const day = this.state.selectedDay;\n    const moods = Object.assign({}, this.state.moods);\n    moods[day] = Object.assign({}, moods[day] || {}, { note: val });\n    this.setState({ moods });\n    this.save('home_moods', moods);\n  }\n\n  updateSettings(patch) {\n    const settings = Object.assign({}, this.state.settings, patch);\n    this.setState({ settings });\n    this.save('home_settings', settings);\n    if (patch.city) setTimeout(() => this.fetchWeather(), 0);\n    if ('apiMode' in patch || 'apiBase' in patch || 'apiKey' in patch || 'apiModel' in patch) {\n      this.setState({ online: null });\n      setTimeout(() => this.checkOnline(), 0);\n    }\n  }\n\n  handleBgFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const max = 1200;\n        const scale = Math.min(1, max / Math.max(img.width, img.height));\n        const canvas = document.createElement('canvas');\n        canvas.width = Math.round(img.width * scale);\n        canvas.height = Math.round(img.height * scale);\n        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);\n        const url = canvas.toDataURL('image/jpeg', .8);\n        this.setState({ bg: url });\n        this.save('home_bg', url);\n      };\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n  }\n\n  addMemory() {\n    const t = (this.state.memInput || '').trim();\n    if (!t) return;\n    const mems = this.state.memories.concat([{ id: Date.now(), by: 'me', text: t }]);\n    this.setState({ memories: mems, memInput: '' });\n    this.save('home_memories', mems);\n  }\n  deleteMemory(id) {\n    const mems = this.state.memories.filter(m => m.id !== id);\n    this.setState({ memories: mems });\n    this.save('home_memories', mems);\n  }\n  memoryText() {\n    return (this.state.memories || []).map(m => '· ' + m.text).join('\\n');\n  }\n\n  async fetchModels() {\n    const set = this.state.settings;\n    if (!set.apiKey) { this.setState({ modelMsg: '先填好 API Key' }); return; }\n    let url, headers;\n    if (set.apiMode === 'anthropic') {\n      url = 'https://api.anthropic.com/v1/models';\n      headers = { 'x-api-key': set.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };\n    } else {\n      const base = (set.apiBase || '').replace(/\\/+$/, '');\n      if (!base) { this.setState({ modelMsg: '先填好上面的站点地址' }); return; }\n      url = base + '/v1/models';\n      headers = { 'Authorization': 'Bearer ' + set.apiKey };\n
